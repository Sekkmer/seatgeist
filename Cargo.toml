[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Sekkmer"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sekkmer/seatgeist"
homepage = "https://github.com/Sekkmer/seatgeist"
description = "Experimental KDE Plasma 6 desktop tools for Codex."

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.88"
base64 = "0.22.1"
clap = { version = "4.5.41", features = ["derive", "env"] }
image = { version = "0.25.8", default-features = false, features = ["png"] }
libc = "0.2.186"
# Ubuntu 24.04 ships PipeWire/SPA 1.0 headers. Seatgeist does not use the
# explicit-sync APIs added in 1.2, so keep the bindings at the oldest API we
# actually require instead of making builds depend on newer host headers.
pipewire = { version = "0.10.0", features = ["v1_0_0"] }
libseatgeist = { path = "crates/libseatgeist" }
seatgeist-backend = { path = "crates/seatgeist-backend" }
seatgeist-atspi = { path = "crates/seatgeist-atspi" }
seatgeist-eis = { path = "crates/seatgeist-eis" }
seatgeist-kwin = { path = "crates/seatgeist-kwin" }
seatgeist-policy = { path = "crates/seatgeist-policy" }
seatgeist-portal = { path = "crates/seatgeist-portal" }
seatgeist-pipewire = { path = "crates/seatgeist-pipewire" }
seatgeist-uinput = { path = "crates/seatgeist-uinput" }
seatgeist-testkit = { path = "crates/seatgeist-testkit" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"
tokio = { version = "1.46.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
toml = "0.8"
uuid = { version = "1.17.0", features = ["serde", "v4"] }
wait-timeout = "0.2.1"
zbus = { version = "5.16.0", default-features = false, features = ["tokio"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "warn"
todo = "warn"
unwrap_used = "warn"
