[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Sekkmer"]
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/plasma-pilot"
homepage = "https://example.invalid/plasma-pilot"
description = "KDE Plasma desktop-control substrate for Codex."

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.88"
clap = { version = "4.5.41", features = ["derive", "env"] }
libplasma-pilot = { path = "crates/libplasma-pilot" }
plasma-pilot-backend = { path = "crates/plasma-pilot-backend" }
plasma-pilot-policy = { path = "crates/plasma-pilot-policy" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.46.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
uuid = { version = "1.17.0", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "warn"
todo = "warn"
unwrap_used = "warn"
